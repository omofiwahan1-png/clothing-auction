<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lot Listings — Clothing Auction</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#17181a;
    --ink-2:#1f2023;
    --paper:#efe9dc;
    --paper-2:#e4ddcc;
    --brass:#c08a28;
    --brass-bright:#e0a83e;
    --rust:#a73b2c;
    --moss:#5b6b4f;
    --line: rgba(239,233,220,0.14);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--ink);
    color:var(--paper);
    font-family:'IBM Plex Sans', sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{ max-width:1080px; margin:0 auto; padding:0 20px 80px; }

  /* ---------- Masthead ---------- */
  header.masthead{
    padding:52px 20px 30px;
    text-align:center;
    border-bottom:1px solid var(--line);
    margin-bottom:36px;
  }
  .eyebrow{
    font-family:'IBM Plex Mono', monospace;
    letter-spacing:.28em;
    font-size:11px;
    color:var(--brass-bright);
    text-transform:uppercase;
  }
  h1.title{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:clamp(38px,7vw,64px);
    margin:10px 0 6px;
    letter-spacing:-0.01em;
  }
  .subtitle{
    font-style:italic;
    font-family:'Fraunces', serif;
    font-weight:500;
    color:var(--paper-2);
    opacity:.75;
    font-size:16px;
    max-width:480px;
    margin:0 auto;
  }
  .stat-row{
    display:flex; justify-content:center; gap:28px; margin-top:22px;
    font-family:'IBM Plex Mono', monospace; font-size:12px; color:var(--paper-2); opacity:.8;
  }
  .stat-row span b{color:var(--brass-bright); font-weight:600;}

  /* ---------- New lot form (paddle intake) ---------- */
  .intake{
    background:var(--ink-2);
    border:1px solid var(--line);
    border-radius:4px;
    padding:22px 22px 20px;
    margin-bottom:40px;
    display:none;
  }
  .intake.visible{ display:block; }
  .intake summary{
    cursor:pointer;
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    letter-spacing:.15em;
    text-transform:uppercase;
    color:var(--brass-bright);
    outline:none;
    display:flex; align-items:center; gap:10px;
  }
  .intake summary::before{ content:"＋"; font-size:14px; }
  .intake[open] summary::before{ content:"－"; }
  .intake-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
    margin-top:18px;
  }
  .intake-grid .full{ grid-column:1/-1; }
  @media (max-width:520px){ .intake-grid{grid-template-columns:1fr;} }
  label.field-label{
    display:block; font-family:'IBM Plex Mono', monospace; font-size:10px;
    letter-spacing:.12em; text-transform:uppercase; color:var(--paper-2); opacity:.7; margin-bottom:6px;
  }
  input, textarea, select{
    width:100%;
    background:var(--ink);
    border:1px solid var(--line);
    color:var(--paper);
    font-family:'IBM Plex Sans', sans-serif;
    font-size:14px;
    padding:10px 11px;
    border-radius:3px;
  }
  textarea{ resize:vertical; min-height:52px; }
  input:focus, textarea:focus, select:focus{
    outline:2px solid var(--brass); outline-offset:1px; border-color:var(--brass);
  }
  .btn{
    font-family:'IBM Plex Mono', monospace;
    letter-spacing:.1em;
    text-transform:uppercase;
    font-size:12px;
    font-weight:600;
    padding:11px 20px;
    border-radius:3px;
    border:1px solid var(--brass);
    background:transparent;
    color:var(--brass-bright);
    cursor:pointer;
    transition:background .15s, color .15s;
  }
  .btn:hover{ background:var(--brass); color:var(--ink); }
  .btn.solid{ background:var(--brass); color:var(--ink); }
  .btn.solid:hover{ background:var(--brass-bright); }
  .btn:disabled{ opacity:.4; cursor:not-allowed; }
  .intake-actions{ margin-top:16px; display:flex; justify-content:flex-end; }

  /* ---------- Grid ---------- */
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(270px,1fr));
    gap:22px;
  }
  .lot{
    background:var(--paper);
    color:var(--ink);
    border-radius:4px;
    overflow:hidden;
    position:relative;
    display:flex; flex-direction:column;
    box-shadow:0 10px 26px rgba(0,0,0,.28);
  }
  .lot-badge{
    position:absolute; top:12px; left:12px;
    background:var(--ink);
    color:var(--brass-bright);
    font-family:'IBM Plex Mono', monospace;
    font-size:11px; letter-spacing:.1em;
    padding:5px 9px;
    border-radius:2px;
    border:1px solid var(--brass);
    z-index:2;
  }
  .lot-swatch{
    height:150px;
    position:relative;
    display:flex; align-items:center; justify-content:center;
    background:
      repeating-linear-gradient(45deg, rgba(23,24,26,.06) 0 2px, transparent 2px 14px),
      var(--sw, #d8cfb8);
    border-bottom:1px dashed rgba(23,24,26,.25);
  }
  .lot-swatch .stitch{
    position:absolute; inset:10px;
    border:1.5px dashed rgba(23,24,26,.35);
    border-radius:2px;
  }
  .lot-swatch .glyph{
    font-size:34px;
    opacity:.55;
  }
  .lot-gallery{ position:relative; }
  .lot-gallery .main-photo{
    height:150px; width:100%; object-fit:cover; display:block;
    border-bottom:1px dashed rgba(23,24,26,.25);
    background:#d8cfb8;
  }
  .lot-gallery .photo-count-badge{
    position:absolute; bottom:8px; right:8px;
    background:rgba(23,24,26,.75); color:var(--paper);
    font-family:'IBM Plex Mono', monospace; font-size:10.5px;
    padding:3px 7px; border-radius:2px; letter-spacing:.04em;
  }
  .thumb-strip{
    display:flex; gap:5px; padding:8px 8px 0; overflow-x:auto;
  }
  .thumb-strip img{
    width:38px; height:38px; object-fit:cover; border-radius:2px; cursor:pointer;
    border:2px solid transparent; opacity:.65; flex:none;
    transition:opacity .12s, border-color .12s;
  }
  .thumb-strip img:hover{ opacity:.9; }
  .thumb-strip img.active{ opacity:1; border-color:var(--rust); }

  /* ---------- Intake photo upload ---------- */
  input[type=file]{
    padding:9px 10px; font-size:12.5px; cursor:pointer;
  }
  .preview-strip{
    display:flex; flex-wrap:wrap; gap:8px; margin-top:10px;
  }
  .preview-thumb{
    position:relative; width:56px; height:56px; border-radius:3px; overflow:hidden;
    border:1px solid var(--line);
  }
  .preview-thumb img{ width:100%; height:100%; object-fit:cover; display:block; }
  .preview-thumb button{
    position:absolute; top:2px; right:2px;
    width:16px; height:16px; border-radius:50%;
    background:rgba(23,24,26,.8); color:var(--paper);
    border:none; font-size:10px; line-height:1; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .preview-thumb button:hover{ background:var(--rust); }

  .seller-access{
    text-align:center; margin-top:52px;
  }
  .seller-access button{
    background:none; border:none; cursor:pointer;
    font-family:'IBM Plex Mono', monospace; font-size:10.5px;
    letter-spacing:.08em; color:rgba(239,233,220,.28);
    padding:6px;
  }
  .seller-access button:hover{ color:rgba(239,233,220,.55); }
  .lot-body{ padding:16px 16px 14px; display:flex; flex-direction:column; gap:10px; flex:1; }
  .lot-title{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:19px;
    line-height:1.15;
  }
  .lot-meta{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    letter-spacing:.04em;
    color:rgba(23,24,26,.6);
    display:flex; gap:10px; flex-wrap:wrap;
  }
  .lot-desc{ font-size:13px; color:rgba(23,24,26,.75); line-height:1.4; }

  .bid-block{
    margin-top:auto;
    border-top:1px solid rgba(23,24,26,.15);
    padding-top:12px;
  }
  .bid-current-label{
    font-family:'IBM Plex Mono', monospace;
    font-size:10px; letter-spacing:.12em; text-transform:uppercase;
    color:rgba(23,24,26,.55);
  }
  .bid-current-value{
    font-family:'IBM Plex Mono', monospace;
    font-weight:600;
    font-size:26px;
    color:var(--rust);
    line-height:1.2;
  }
  .bid-current-value .cur{ font-size:16px; opacity:.7; margin-right:2px; }
  .bid-count{ font-family:'IBM Plex Mono', monospace; font-size:11px; color:rgba(23,24,26,.55); }

  .bid-form{ display:flex; gap:8px; margin-top:10px; }
  .bid-form input[type=text], .bid-form input[type=number]{
    background:#fff; border:1px solid rgba(23,24,26,.3); color:var(--ink); font-size:13px; padding:9px 10px;
  }
  .bid-form .name-input{ flex:0 0 34%; }
  .bid-form .amt-input{ flex:1; }
  .bid-form button{
    background:var(--ink); color:var(--brass-bright); border:none;
    font-family:'IBM Plex Mono', monospace; font-size:12px; letter-spacing:.06em;
    padding:0 14px; border-radius:3px; cursor:pointer; text-transform:uppercase;
  }
  .bid-form button:hover{ background:#000; }
  .bid-form button:disabled{ opacity:.35; cursor:not-allowed; }

  .bid-error{ font-size:11.5px; color:var(--rust); font-family:'IBM Plex Mono', monospace; min-height:14px; }

  details.history{ margin-top:6px; }
  details.history summary{
    font-family:'IBM Plex Mono', monospace; font-size:10.5px; color:rgba(23,24,26,.55);
    cursor:pointer; letter-spacing:.06em; text-transform:uppercase;
  }
  .history-list{ margin-top:8px; display:flex; flex-direction:column; gap:5px; max-height:110px; overflow-y:auto; }
  .history-row{
    display:flex; justify-content:space-between;
    font-family:'IBM Plex Mono', monospace; font-size:11.5px;
    color:rgba(23,24,26,.7);
    border-bottom:1px dotted rgba(23,24,26,.15);
    padding-bottom:3px;
  }
  .history-row b{ color:var(--ink); }

  .empty{
    text-align:center; padding:60px 20px; color:rgba(239,233,220,.5);
    font-family:'IBM Plex Mono', monospace; font-size:13px; letter-spacing:.04em;
    border:1px dashed var(--line); border-radius:4px;
  }

  .toast{
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%) translateY(20px);
    background:var(--brass); color:var(--ink); font-family:'IBM Plex Mono', monospace;
    font-size:12.5px; font-weight:600; padding:11px 18px; border-radius:4px;
    opacity:0; transition:opacity .25s, transform .25s; pointer-events:none; z-index:50;
    box-shadow:0 8px 24px rgba(0,0,0,.35);
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  .loading{ text-align:center; padding:60px; color:var(--paper-2); font-family:'IBM Plex Mono', monospace; font-size:12px; letter-spacing:.1em; }
</style>
</head>
<body>

<div class="wrap">
  <header class="masthead">
    <div class="eyebrow">Est. Today · Private Sale</div>
    <h1 class="title">Lot Listings</h1>
    <div class="subtitle">A running catalog. Post a piece, let the room decide what it's worth.</div>
    <div class="stat-row">
      <span id="statLots"><b>0</b> lots open</span>
      <span id="statBids"><b>0</b> bids placed</span>
    </div>
  </header>

  <details class="intake" id="intake">
    <summary>List a new lot</summary>
    <div class="intake-grid">
      <div class="full">
        <label class="field-label">Item title</label>
        <input type="text" id="f-title" placeholder="e.g. Levi's 501 raw denim, W32 L32" maxlength="80">
      </div>
      <div>
        <label class="field-label">Size</label>
        <input type="text" id="f-size" placeholder="M / W32 / UK 9…" maxlength="20">
      </div>
      <div>
        <label class="field-label">Condition</label>
        <select id="f-condition">
          <option>New with tags</option>
          <option selected>Excellent</option>
          <option>Good</option>
          <option>Worn</option>
        </select>
      </div>
      <div class="full">
        <label class="field-label">Description</label>
        <textarea id="f-desc" placeholder="Brand, fabric, flaws, why it's worth bidding on…" maxlength="240"></textarea>
      </div>
      <div>
        <label class="field-label">Starting bid ($)</label>
        <input type="number" id="f-start" min="1" step="1" placeholder="20">
      </div>
      <div class="full">
        <label class="field-label">Photos <span id="photoCount" style="opacity:.6;">(0/10)</span></label>
        <input type="file" id="f-photos" accept="image/*" multiple>
        <div class="preview-strip" id="previewStrip"></div>
      </div>
    </div>
    <div class="intake-actions">
      <button class="btn solid" id="btnAddLot">Post lot</button>
    </div>
  </details>

  <div id="content" class="loading">Opening the floor…</div>

  <div class="seller-access">
    <button id="sellerAccessBtn" type="button">Seller sign-in</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const GLYPHS = ['👕','👖','🧥','👗','👟','🧢','👔','🩳','🧣','👜','🥾','👘'];

function esc(s){
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}
function fmtMoney(n){
  return Number(n).toLocaleString('en-US', {minimumFractionDigits:0, maximumFractionDigits:2});
}
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(showToast._h);
  showToast._h = setTimeout(()=> t.classList.remove('show'), 2200);
}
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

let lots = [];
let pendingImages = [];
let isSeller = false;
const MAX_PHOTOS = 10;

// Change this to your own passcode — only someone with it can list items.
const SELLER_PASSCODE = "Yappingbird";

function unlockSelling(){
  isSeller = true;
  const intake = document.getElementById('intake');
  intake.classList.add('visible');
  intake.setAttribute('open', '');
  document.getElementById('sellerAccessBtn').style.display = 'none';
  intake.scrollIntoView({behavior:'smooth', block:'start'});
}

document.getElementById('sellerAccessBtn').addEventListener('click', () => {
  const code = prompt('Enter the seller passcode to list an item:');
  if(code === SELLER_PASSCODE){
    unlockSelling();
  } else if(code !== null){
    showToast('Incorrect passcode');
  }
});

// Optional shortcut: open the page with ?key=your-passcode to skip the prompt.
(function checkUrlKey(){
  const params = new URLSearchParams(window.location.search);
  if(params.get('key') === SELLER_PASSCODE){
    unlockSelling();
  }
})();

function resizeImage(file, maxDim, quality){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        if(w > maxDim || h > maxDim){
          if(w > h){ h = Math.round(h * maxDim / w); w = maxDim; }
          else { w = Math.round(w * maxDim / h); h = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = () => reject(new Error('bad image'));
      img.src = e.target.result;
    };
    reader.onerror = () => reject(new Error('read failed'));
    reader.readAsDataURL(file);
  });
}

function renderPreviews(){
  document.getElementById('photoCount').textContent = `(${pendingImages.length}/${MAX_PHOTOS})`;
  document.getElementById('previewStrip').innerHTML = pendingImages.map((src, i) => `
    <div class="preview-thumb">
      <img src="${src}">
      <button onclick="removePendingImage(${i})" aria-label="Remove photo">✕</button>
    </div>
  `).join('');
}

function removePendingImage(i){
  pendingImages.splice(i, 1);
  renderPreviews();
}

document.getElementById('f-photos').addEventListener('change', async (e) => {
  const files = Array.from(e.target.files || []);
  const room = MAX_PHOTOS - pendingImages.length;
  if(files.length > room){
    showToast(`Only ${MAX_PHOTOS} photos per lot — added first ${Math.max(room,0)}`);
  }
  const toAdd = files.slice(0, room);
  for(const file of toAdd){
    try{
      const dataUrl = await resizeImage(file, 1000, 0.72);
      pendingImages.push(dataUrl);
      renderPreviews();
    }catch(err){
      showToast('Could not read one of the photos');
    }
  }
  e.target.value = '';
});

let lastLotsSnapshot = '';

async function loadLots(){
  try{
    const res = await window.storage.get('lots', true);
    lots = res && res.value ? JSON.parse(res.value) : [];
  }catch(e){
    lots = [];
  }
  lastLotsSnapshot = JSON.stringify(lots);
  render();
}

// Silently re-check storage every few seconds so other open tabs/devices
// pick up new lots and bids without needing a manual refresh.
async function pollLots(){
  try{
    const res = await window.storage.get('lots', true);
    const fresh = res && res.value ? res.value : '[]';
    if(fresh !== lastLotsSnapshot){
      lastLotsSnapshot = fresh;
      lots = JSON.parse(fresh);
      render();
    }
  }catch(e){
    // ignore transient errors, try again next interval
  }
}
setInterval(pollLots, 4000);

async function saveLots(){
  try{
    lastLotsSnapshot = JSON.stringify(lots);
    await window.storage.set('lots', lastLotsSnapshot, true);
  }catch(e){
    showToast('Could not save — try again');
  }
}

async function addLot(){
  if(!isSeller){ showToast('Only the seller can list items'); return; }
  const title = document.getElementById('f-title').value.trim();
  const size = document.getElementById('f-size').value.trim();
  const condition = document.getElementById('f-condition').value;
  const desc = document.getElementById('f-desc').value.trim();
  const start = parseFloat(document.getElementById('f-start').value);

  if(!title){ showToast('Give the piece a title'); return; }
  if(!start || start <= 0){ showToast('Set a starting bid above $0'); return; }

  const lot = {
    id: uid(),
    lotNo: String(lots.length + 1).padStart(3,'0'),
    title, size, condition, desc,
    start,
    images: pendingImages.slice(),
    glyph: GLYPHS[Math.floor(Math.random()*GLYPHS.length)],
    bids: [],
    createdAt: Date.now()
  };
  lots.unshift(lot);
  await saveLots();
  document.getElementById('f-title').value='';
  document.getElementById('f-size').value='';
  document.getElementById('f-desc').value='';
  document.getElementById('f-start').value='';
  pendingImages = [];
  renderPreviews();
  document.getElementById('intake').removeAttribute('open');
  showToast('Lot ' + lot.lotNo + ' posted');
  render();
}

async function placeBid(lotId){
  const nameInput = document.getElementById('name-'+lotId);
  const amtInput = document.getElementById('amt-'+lotId);
  const errEl = document.getElementById('err-'+lotId);
  errEl.textContent = '';

  const lot = lots.find(l => l.id === lotId);
  if(!lot) return;

  const name = nameInput.value.trim();
  const amt = parseFloat(amtInput.value);
  const currentHigh = lot.bids.length ? lot.bids[lot.bids.length-1].amount : lot.start - 0.01;

  if(!name){ errEl.textContent = 'Enter a name to bid'; return; }
  if(!amt || isNaN(amt)){ errEl.textContent = 'Enter a valid amount'; return; }
  if(amt <= currentHigh){ errEl.textContent = 'Must beat $' + fmtMoney(currentHigh); return; }

  lot.bids.push({ name, amount: amt, at: Date.now() });
  await saveLots();
  showToast(name + ' takes the lead on Lot ' + lot.lotNo);
  render();
}

function setActiveImage(lotId, idx, thumbEl){
  const lot = lots.find(l => l.id === lotId);
  if(!lot) return;
  const mainImg = document.getElementById('main-img-'+lotId);
  if(mainImg) mainImg.src = lot.images[idx];
  const badge = mainImg && mainImg.parentElement.querySelector('.photo-count-badge');
  if(badge) badge.textContent = (idx+1) + '/' + lot.images.length;
  const strip = thumbEl.parentElement;
  strip.querySelectorAll('img').forEach(im => im.classList.remove('active'));
  thumbEl.classList.add('active');
}

function lotCard(lot){
  const hasBids = lot.bids.length > 0;
  const current = hasBids ? lot.bids[lot.bids.length-1].amount : lot.start;
  const leader = hasBids ? lot.bids[lot.bids.length-1].name : null;
  const historyRows = lot.bids.slice().reverse().slice(0,8).map(b =>
    `<div class="history-row"><span>${esc(b.name)}</span><b>$${fmtMoney(b.amount)}</b></div>`
  ).join('');

  const hasPhotos = lot.images && lot.images.length > 0;
  const galleryHtml = hasPhotos ? `
    <div class="lot-gallery">
      <img class="main-photo" id="main-img-${lot.id}" src="${lot.images[0]}">
      ${lot.images.length > 1 ? `<div class="photo-count-badge">1/${lot.images.length}</div>` : ''}
      ${lot.images.length > 1 ? `
      <div class="thumb-strip">
        ${lot.images.map((src, i) => `<img src="${src}" class="${i===0?'active':''}" onclick="setActiveImage('${lot.id}', ${i}, this)">`).join('')}
      </div>` : ''}
    </div>
  ` : `
    <div class="lot-swatch">
      <div class="stitch"></div>
      <div class="glyph">${lot.glyph}</div>
    </div>
  `;

  return `
  <div class="lot">
    <div class="lot-badge">LOT ${lot.lotNo}</div>
    ${galleryHtml}
    <div class="lot-body">
      <div class="lot-title">${esc(lot.title)}</div>
      <div class="lot-meta">
        ${lot.size ? `<span>SIZE ${esc(lot.size)}</span>` : ''}
        <span>${esc(lot.condition)}</span>
      </div>
      ${lot.desc ? `<div class="lot-desc">${esc(lot.desc)}</div>` : ''}

      <div class="bid-block">
        <div class="bid-current-label">${hasBids ? 'Current bid' : 'Starting bid'}${leader ? ' · ' + esc(leader) : ''}</div>
        <div class="bid-current-value"><span class="cur">$</span>${fmtMoney(current)}</div>
        <div class="bid-count">${lot.bids.length} bid${lot.bids.length===1?'':'s'}</div>

        <div class="bid-form">
          <input type="text" class="name-input" id="name-${lot.id}" placeholder="Your name" maxlength="24">
          <input type="number" class="amt-input" id="amt-${lot.id}" placeholder="$${fmtMoney(current + 1)}" min="0" step="1">
          <button onclick="placeBid('${lot.id}')">Bid</button>
        </div>
        <div class="bid-error" id="err-${lot.id}"></div>

        ${hasBids ? `
        <details class="history">
          <summary>Bid history (${lot.bids.length})</summary>
          <div class="history-list">${historyRows}</div>
        </details>` : ''}
      </div>
    </div>
  </div>`;
}

function render(){
  const content = document.getElementById('content');
  document.getElementById('statLots').innerHTML = `<b>${lots.length}</b> lots open`;
  document.getElementById('statBids').innerHTML = `<b>${lots.reduce((s,l)=>s+l.bids.length,0)}</b> bids placed`;

  if(lots.length === 0){
    content.className = '';
    content.innerHTML = `<div class="empty">No lots on the floor yet.<br>Post the first piece above.</div>`;
    return;
  }
  content.className = 'grid';
  content.innerHTML = lots.map(lotCard).join('');
}

document.getElementById('btnAddLot').addEventListener('click', addLot);
loadLots();
</script>
</body>
</html>
