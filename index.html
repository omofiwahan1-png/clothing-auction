<html lang="en">
<head>
<meta charset="UTF-8">

<title>Lot Listings — Clothing Auction</title>

<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">

<style>
  :root{
    --bg:#1c7a41;
    --ink:#0d2b18;
    --ink-2:#22603a;
    --paper:#efe9dc;
    --paper-2:#e4ddcc;
    --brass:#c08a28;
    --brass-bright:#e0a83e;
    --rust:#a73b2c;
    --moss:#5b6b4f;
    --line: rgba(239,233,220,0.14);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--paper);
    font-family:'IBM Plex Sans', sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{ max-width:1080px; margin:0 auto; padding:0 20px 80px; }

  /* ---------- Masthead ---------- */
  header.masthead{
    padding:52px 20px 30px;
    text-align:center;
    border-bottom:1px solid var(--line);
    margin-bottom:36px;
  }
  .eyebrow{
    font-family:'IBM Plex Mono', monospace;
    letter-spacing:.28em;
    font-size:11px;
    color:var(--brass-bright);
    text-transform:uppercase;
  }
  h1.title{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:clamp(38px,7vw,64px);
    margin:10px 0 6px;
    letter-spacing:-0.01em;
  }
  .subtitle{
    font-style:italic;
    font-family:'Fraunces', serif;
    font-weight:500;
    color:var(--paper-2);
    opacity:.75;
    font-size:16px;
    max-width:480px;
    margin:0 auto;
  }
  .stat-row{
    display:flex; justify-content:center; gap:28px; margin-top:22px;
    font-family:'IBM Plex Mono', monospace; font-size:12px; color:var(--paper-2); opacity:.8;
  }
  .stat-row span b{color:var(--brass-bright); font-weight:600;}

  /* ---------- New lot form (paddle intake) ---------- */
  .intake{
    background:var(--ink-2);
    border:1px solid var(--line);
    border-radius:4px;
    padding:22px 22px 20px;
    margin-bottom:40px;
    display:none;
  }
  .intake.visible{ display:block; }
  .intake summary{
    cursor:pointer;
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    letter-spacing:.15em;
    text-transform:uppercase;
    color:var(--brass-bright);
    outline:none;
    display:flex; align-items:center; gap:10px;
  }
  .intake summary::before{ content:"＋"; font-size:14px; }
  .intake[open] summary::before{ content:"－"; }
  .intake-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
    margin-top:18px;
  }
  .intake-grid .full{ grid-column:1/-1; }
  @media (max-width:520px){ .intake-grid{grid-template-columns:1fr;} }
  label.field-label{
    display:block; font-family:'IBM Plex Mono', monospace; font-size:10px;
    letter-spacing:.12em; text-transform:uppercase; color:var(--paper-2); opacity:.7; margin-bottom:6px;
  }
  input, textarea, select{
    width:100%;
    background:var(--ink);
    border:1px solid var(--line);
    color:var(--paper);
    font-family:'IBM Plex Sans', sans-serif;
    font-size:14px;
    padding:10px 11px;
    border-radius:3px;
  }
  textarea{ resize:vertical; min-height:52px; }
  input:focus, textarea:focus, select:focus{
    outline:2px solid var(--brass); outline-offset:1px; border-color:var(--brass);
  }
  .btn{
    font-family:'IBM Plex Mono', monospace;
    letter-spacing:.1em;
    text-transform:uppercase;
    font-size:12px;
    font-weight:600;
    padding:11px 20px;
    border-radius:3px;
    border:1px solid var(--brass);
    background:transparent;
    color:var(--brass-bright);
    cursor:pointer;
    transition:background .15s, color .15s;
  }
  .btn:hover{ background:var(--brass); color:var(--ink); }
  .btn.solid{ background:var(--brass); color:var(--ink); }
  .btn.solid:hover{ background:var(--brass-bright); }
  .btn:disabled{ opacity:.4; cursor:not-allowed; }
  .intake-actions{ margin-top:16px; display:flex; justify-content:flex-end; }

  /* ---------- Grid ---------- */
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(270px,1fr));
    gap:22px;
  }
  .lot{
    background:var(--paper);
    color:var(--ink);
    border-radius:4px;
    overflow:hidden;
    position:relative;
    display:flex; flex-direction:column;
    box-shadow:0 10px 26px rgba(0,0,0,.28);
  }
  .lot-badge{
    position:absolute; top:12px; left:12px;
    background:var(--ink);
    color:var(--brass-bright);
    font-family:'IBM Plex Mono', monospace;
    font-size:11px; letter-spacing:.1em;
    padding:5px 9px;
    border-radius:2px;
    border:1px solid var(--brass);
    z-index:2;
  }
  .lot-swatch{
    height:150px;
    position:relative;
    display:flex; align-items:center; justify-content:center;
    background:
      repeating-linear-gradient(45deg, rgba(23,24,26,.06) 0 2px, transparent 2px 14px),
      var(--sw, #d8cfb8);
    border-bottom:1px dashed rgba(23,24,26,.25);
  }
  .lot-swatch .stitch{
    position:absolute; inset:10px;
    border:1.5px dashed rgba(23,24,26,.35);
    border-radius:2px;
  }
  .lot-swatch .glyph{
    font-size:34px;
    opacity:.55;
  }
  .lot-gallery{ position:relative; }
  .lot-gallery .main-photo{
    height:150px; width:100%; object-fit:cover; display:block;
    border-bottom:1px dashed rgba(23,24,26,.25);
    background:#d8cfb8;
  }
  .lot-gallery .photo-count-badge{
    position:absolute; bottom:8px; right:8px;
    background:rgba(23,24,26,.75); color:var(--paper);
    font-family:'IBM Plex Mono', monospace; font-size:10.5px;
    padding:3px 7px; border-radius:2px; letter-spacing:.04em;
  }
  .thumb-strip{
    display:flex; gap:5px; padding:8px 8px 0; overflow-x:auto;
  }
  .thumb-strip img{
    width:38px; height:38px; object-fit:cover; border-radius:2px; cursor:pointer;
    border:2px solid transparent; opacity:.65; flex:none;
    transition:opacity .12s, border-color .12s;
  }
  .thumb-strip img:hover{ opacity:.9; }
  .thumb-strip img.active{ opacity:1; border-color:var(--rust); }

  /* ---------- Intake photo upload ---------- */
  input[type=file]{
    padding:9px 10px; font-size:12.5px; cursor:pointer;
  }
  .preview-strip{
    display:flex; flex-wrap:wrap; gap:8px; margin-top:10px;
  }
  .preview-thumb{
    position:relative; width:56px; height:56px; border-radius:3px; overflow:hidden;
    border:1px solid var(--line);
  }
  .preview-thumb img{ width:100%; height:100%; object-fit:cover; display:block; }
  .preview-thumb button{
    position:absolute; top:2px; right:2px;
    width:16px; height:16px; border-radius:50%;
    background:rgba(23,24,26,.8); color:var(--paper);
    border:none; font-size:10px; line-height:1; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .preview-thumb button:hover{ background:var(--rust); }

  .seller-access{
    text-align:center; margin-top:52px;
  }
  .seller-access button{
    background:none; border:none; cursor:pointer;
    font-family:'IBM Plex Mono', monospace; font-size:10.5px;
    letter-spacing:.08em; color:rgba(239,233,220,.28);
    padding:6px;
  }
  .seller-access button:hover{ color:rgba(239,233,220,.55); }
  .lot-body{ padding:16px 16px 14px; display:flex; flex-direction:column; gap:10px; flex:1; }
  .lot-title{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:19px;
    line-height:1.15;
  }
  .lot-meta{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    letter-spacing:.04em;
    color:rgba(23,24,26,.6);
    display:flex; gap:10px; flex-wrap:wrap;
  }
  .lot-desc{ font-size:13px; color:rgba(23,24,26,.75); line-height:1.4; }

  .bid-block{
    margin-top:auto;
    border-top:1px solid rgba(23,24,26,.15);
    padding-top:12px;
  }
  .bid-current-label{
    font-family:'IBM Plex Mono', monospace;
    font-size:10px; letter-spacing:.12em; text-transform:uppercase;
    color:rgba(23,24,26,.55);
  }
  .bid-current-value{
    font-family:'IBM Plex Mono', monospace;
    font-weight:600;
    font-size:26px;
    color:var(--rust);
    line-height:1.2;
  }
  .bid-current-value .cur{ font-size:16px; opacity:.7; margin-right:2px; }
  .bid-count{ font-family:'IBM Plex Mono', monospace; font-size:11px; color:rgba(23,24,26,.55); }

  .bid-form{ display:flex; gap:8px; margin-top:10px; }
  .bid-form input[type=text], .bid-form input[type=number]{
    background:#fff; border:1px solid rgba(23,24,26,.3); color:var(--ink); font-size:13px; padding:9px 10px;
  }
  .bid-form .name-input{ flex:0 0 34%; }
  .bid-form .amt-input{ flex:1; }
  .bid-form button{
    background:var(--ink); color:var(--brass-bright); border:none;
    font-family:'IBM Plex Mono', monospace; font-size:12px; letter-spacing:.06em;
    padding:0 14px; border-radius:3px; cursor:pointer; text-transform:uppercase;
  }
  .bid-form button:hover{ background:#061a0e; }
  .bid-form button:disabled{ opacity:.35; cursor:not-allowed; }

  .bid-error{ font-size:11.5px; color:var(--rust); font-family:'IBM Plex Mono', monospace; min-height:14px; }

  details.history{ margin-top:6px; }
  details.history summary{
    font-family:'IBM Plex Mono', monospace; font-size:10.5px; color:rgba(23,24,26,.55);
    cursor:pointer; letter-spacing:.06em; text-transform:uppercase;
  }
  .history-list{ margin-top:8px; display:flex; flex-direction:column; gap:5px; max-height:110px; overflow-y:auto; }
  .history-row{
    display:flex; justify-content:space-between;
    font-family:'IBM Plex Mono', monospace; font-size:11.5px;
    color:rgba(23,24,26,.7);
    border-bottom:1px dotted rgba(23,24,26,.15);
    padding-bottom:3px;
  }
  .history-row b{ color:var(--ink); }

  .empty{
    text-align:center; padding:60px 20px; color:rgba(239,233,220,.5);
    font-family:'IBM Plex Mono', monospace; font-size:13px; letter-spacing:.04em;
    border:1px dashed var(--line); border-radius:4px;
  }

  .toast{
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%) translateY(20px);
    background:var(--brass); color:var(--ink); font-family:'IBM Plex Mono', monospace;
    font-size:12.5px; font-weight:600; padding:11px 18px; border-radius:4px;
    opacity:0; transition:opacity .25s, transform .25s; pointer-events:none; z-index:50;
    box-shadow:0 8px 24px rgba(0,0,0,.35);
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  .loading{ text-align:center; padding:60px; color:var(--paper-2); font-family:'IBM Plex Mono', monospace; font-size:12px; letter-spacing:.1em; }

  /* ---------- PIXEL TYPE OVERRIDE ---------- */
  /* VT323 is the readable pixel face for body copy; Press Start 2P is the
     chunky arcade face reserved for headings and buttons, since at body size
     it becomes very hard to read. */
  body, input, textarea, select, button,
  .field-label, .bid-count, .lot-meta, .bid-row, .bid-error,
  .lot-desc, .subtitle, .eyebrow, .stat-row, .loading, .toast{
    font-family:'VT323', monospace !important;
    letter-spacing:0.02em;
  }
  body{ font-size:19px; }
  input, textarea, select{ font-size:19px !important; }
  .field-label{ font-size:15px !important; letter-spacing:.08em; }
  .bid-count, .lot-meta, .bid-error, .loading{ font-size:16px !important; }
  .subtitle{ font-size:19px !important; }

  h1, h2, h3, .title, .lot-title, .btn, button, .lot-no{
    font-family:'Press Start 2P', monospace !important;
    letter-spacing:0 !important;
  }
  .title{ font-size:30px !important; line-height:1.5 !important; }
  .lot-title{ font-size:13px !important; line-height:1.7 !important; }
  .btn, button{ font-size:11px !important; line-height:1.6 !important; }
  .lot-no{ font-size:11px !important; }
  .eyebrow, .stat-row{ font-size:16px !important; }

  /* Keep pixel art crisp rather than smoothed when scaled up */
  img{ image-rendering: pixelated; }
  .lot-gallery .main-photo, .preview-strip img{ image-rendering:auto; }

  /* ---------- RUNNING PIXEL HORSE ---------- */
  .horse-track{
    position:fixed; left:0; right:0; bottom:0; height:72px;
    pointer-events:none; z-index:50; overflow:hidden;
    background:linear-gradient(to top, rgba(28,122,65,.94), rgba(28,122,65,0));
  }
  .horse-ground{
    position:absolute; bottom:14px; left:0; right:0; height:2px;
    background:repeating-linear-gradient(to right,
      var(--brass) 0 8px, transparent 8px 16px);
    opacity:.45;
  }
  /* The whole chase travels across the screen as one group, so the two
     never drift out of sync. Inside the group, the runner closes the gap. */
  .parade{
    position:absolute; bottom:0; left:-160px;
    width:1px; height:100%;
    animation: horse-gallop 9s linear infinite;
  }
  .horse{
    position:absolute; bottom:16px; left:96px;
    width:64px; height:48px;
  }
  .horse canvas{ width:64px; height:48px; image-rendering:pixelated; display:block; }
  .runner{
    position:absolute; bottom:16px; left:0;
    width:48px; height:48px;
    animation: runner-close 9s ease-in infinite;
  }
  .runner canvas{ width:48px; height:48px; image-rendering:pixelated; display:block; }
  @keyframes runner-close{
    from{ transform:translateX(0); }
    to{ transform:translateX(58px); }   /* gains on the horse, never quite reaches */
  }
  @keyframes horse-gallop{
    from{ transform:translateX(0); }
    to{ transform:translateX(calc(100vw + 340px)); }
  }
  @media (prefers-reduced-motion: reduce){
    .parade{ animation:none; left:20px; }
    .runner{ animation:none; }
  }

  /* Stop the horse strip from covering the last lot card */
  .wrap{ padding-bottom:90px; }

  /* ---------- VIDEO ---------- */
  .lot-gallery .main-video{
    width:100%; display:block; background:#000;
    border:1px solid var(--line);
  }
  .video-tag{
    display:inline-block; margin-top:6px;
    font-family:'Press Start 2P', monospace; font-size:9px;
    color:var(--brass); letter-spacing:0;
  }
  .video-pending{
    margin-top:8px; font-family:'VT323', monospace; font-size:16px;
    color:var(--brass-bright);
  }
</style>
</head>
<body>

<div class="wrap">
  <header class="masthead">
    <div class="eyebrow">Est. Today · Private Sale</div>
    <h1 class="title">Lot Listings</h1>
    <div class="subtitle">A running catalog. Post a piece, let the room decide what it's worth.</div>
    <div class="stat-row">
      <span id="statLots"><b>0</b> lots open</span>
      <span id="statBids"><b>0</b> bids placed</span>
    </div>
  </header>

  <details class="intake" id="intake">
    <summary>List a new lot</summary>
    <div class="intake-grid">
      <div class="full">
        <label class="field-label">Item title</label>
        <input type="text" id="f-title" placeholder="e.g. Levi's 501 raw denim, W32 L32" maxlength="80">
      </div>
      <div>
        <label class="field-label">Size</label>
        <input type="text" id="f-size" placeholder="M / W32 / UK 9…" maxlength="20">
      </div>
      <div>
        <label class="field-label">Condition</label>
        <select id="f-condition">
          <option>New with tags</option>
          <option selected>Excellent</option>
          <option>Good</option>
          <option>Worn</option>
        </select>
      </div>
      <div class="full">
        <label class="field-label">Description</label>
        <textarea id="f-desc" placeholder="Brand, fabric, flaws, why it's worth bidding on…" maxlength="240"></textarea>
      </div>
      <div>
        <label class="field-label">Starting bid ($)</label>
        <input type="number" id="f-start" min="1" step="1" placeholder="20">
      </div>
      <div class="full">
        <label class="field-label">Photos <span id="photoCount" style="opacity:.6;">(0/10)</span></label>
        <input type="file" id="f-photos" accept="image/*" multiple>
        <div class="preview-strip" id="previewStrip"></div>
      </div>
      <div class="full">
        <label class="field-label">Video <span style="opacity:.6;">(max 10 sec)</span></label>
        <input type="file" id="f-video" accept="video/*">
        <div class="video-pending" id="videoPending"></div>
      </div>
    </div>
    <div class="intake-actions">
      <button class="btn solid" id="btnAddLot">Post lot</button>
    </div>
  </details>

  <div id="content" class="loading">Opening the floor…</div>

  <div class="seller-access">
    <button id="sellerAccessBtn" type="button">Seller sign-in</button>
  </div>
</div>

<div class="horse-track" aria-hidden="true">
  <div class="horse-ground"></div>
  <div class="parade">
    <div class="runner"><canvas id="manCanvas" width="48" height="48"></canvas></div>
    <div class="horse"><canvas id="horseCanvas" width="64" height="48"></canvas></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const GLYPHS = ['👕','👖','🧥','👗','👟','🧢','👔','🩳','🧣','👜','🥾','👘'];

function esc(s){
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}
function fmtMoney(n){
  return Number(n).toLocaleString('en-US', {minimumFractionDigits:0, maximumFractionDigits:2});
}
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(showToast._h);
  showToast._h = setTimeout(()=> t.classList.remove('show'), 2200);
}
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

let lots = [];
let pendingImages = [];
let isSeller = false;
const MAX_PHOTOS = 10;

// Change this to your own passcode — only someone with it can list items.
const SELLER_PASSCODE = "Yappingbird";

function unlockSelling(){
  isSeller = true;
  const intake = document.getElementById('intake');
  intake.classList.add('visible');
  intake.setAttribute('open', '');
  document.getElementById('sellerAccessBtn').style.display = 'none';
  intake.scrollIntoView({behavior:'smooth', block:'start'});
}

document.getElementById('sellerAccessBtn').addEventListener('click', () => {
  const code = prompt('Enter the seller passcode to list an item:');
  if(code === SELLER_PASSCODE){
    unlockSelling();
  } else if(code !== null){
    showToast('Incorrect passcode');
  }
});

// Optional shortcut: open the page with ?key=your-passcode to skip the prompt.
(function checkUrlKey(){
  const params = new URLSearchParams(window.location.search);
  if(params.get('key') === SELLER_PASSCODE){
    unlockSelling();
  }
})();

function resizeImage(file, maxDim, quality){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        if(w > maxDim || h > maxDim){
          if(w > h){ h = Math.round(h * maxDim / w); w = maxDim; }
          else { w = Math.round(w * maxDim / h); h = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = () => reject(new Error('bad image'));
      img.src = e.target.result;
    };
    reader.onerror = () => reject(new Error('read failed'));
    reader.readAsDataURL(file);
  });
}

function renderPreviews(){
  document.getElementById('photoCount').textContent = `(${pendingImages.length}/${MAX_PHOTOS})`;
  document.getElementById('previewStrip').innerHTML = pendingImages.map((src, i) => `
    <div class="preview-thumb">
      <img src="${src}">
      <button onclick="removePendingImage(${i})" aria-label="Remove photo">✕</button>
    </div>
  `).join('');
}

function removePendingImage(i){
  pendingImages.splice(i, 1);
  renderPreviews();
}

document.getElementById('f-photos').addEventListener('change', async (e) => {
  const files = Array.from(e.target.files || []);
  const room = MAX_PHOTOS - pendingImages.length;
  if(files.length > room){
    showToast(`Only ${MAX_PHOTOS} photos per lot — added first ${Math.max(room,0)}`);
  }
  const toAdd = files.slice(0, room);
  for(const file of toAdd){
    try{
      const dataUrl = await resizeImage(file, 1000, 0.72);
      pendingImages.push(dataUrl);
      renderPreviews();
    }catch(err){
      showToast('Could not read one of the photos');
    }
  }
  e.target.value = '';
});

/* ---------- VIDEO UPLOAD ---------- */
let pendingVideo = null;

// Realtime Database stores everything as text, so the video has to be
// base64-encoded. That inflates it by about a third, and RTDB rejects
// very large single values — so we cap the file size as well as duration.
const MAX_VIDEO_BYTES = 3 * 1024 * 1024; // 3 MB before encoding
const MAX_VIDEO_SECONDS = 10;

function readVideoDuration(file){
  return new Promise((resolve, reject) => {
    const v = document.createElement('video');
    v.preload = 'metadata';
    v.onloadedmetadata = () => {
      URL.revokeObjectURL(v.src);
      resolve(v.duration);
    };
    v.onerror = () => reject(new Error('unreadable video'));
    v.src = URL.createObjectURL(file);
  });
}

function fileToDataUrl(file){
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(r.result);
    r.onerror = () => reject(new Error('read failed'));
    r.readAsDataURL(file);
  });
}

document.getElementById('f-video').addEventListener('change', async (e) => {
  const file = (e.target.files || [])[0];
  const pendingEl = document.getElementById('videoPending');
  if(!file){ pendingVideo = null; pendingEl.textContent = ''; return; }

  pendingEl.textContent = 'Checking video…';
  try{
    const duration = await readVideoDuration(file);
    if(duration > MAX_VIDEO_SECONDS + 0.5){
      pendingVideo = null;
      pendingEl.textContent = '';
      e.target.value = '';
      showToast(`Video is ${duration.toFixed(1)}s — trim it to ${MAX_VIDEO_SECONDS}s or under`);
      return;
    }
    if(file.size > MAX_VIDEO_BYTES){
      pendingVideo = null;
      pendingEl.textContent = '';
      e.target.value = '';
      showToast(`Video is ${(file.size/1048576).toFixed(1)}MB — keep it under 3MB`);
      return;
    }
    pendingVideo = await fileToDataUrl(file);
    pendingEl.textContent = `Video ready · ${duration.toFixed(1)}s · ${(file.size/1048576).toFixed(1)}MB`;
  }catch(err){
    pendingVideo = null;
    pendingEl.textContent = '';
    e.target.value = '';
    showToast('Could not read that video file');
  }
});

let lastLotsSnapshot = '';
let suppressNextRender = false;

function loadLots(){
  // Firebase's onValue fires immediately with current data, then again
  // every time the data changes anywhere — this replaces both the old
  // one-time load AND the polling loop with instant, real-time updates.
  const { ref, onValue, db } = window.__fb;
  onValue(ref(db, 'lots'), (snapshot) => {
    const val = snapshot.val();
    lots = val ? Object.values(val) : [];
    const fresh = JSON.stringify(lots);
    if(fresh === lastLotsSnapshot && suppressNextRender){
      suppressNextRender = false;
      return;
    }
    lastLotsSnapshot = fresh;
    render();
  });
}

async function saveLots(){
  try{
    lastLotsSnapshot = JSON.stringify(lots);
    suppressNextRender = true;
    const { ref, set, db } = window.__fb;
    await set(ref(db, 'lots'), lots);
  }catch(e){
    showToast('Could not save — try again');
  }
}

async function addLot(){
  if(!isSeller){ showToast('Only the seller can list items'); return; }
  const title = document.getElementById('f-title').value.trim();
  const size = document.getElementById('f-size').value.trim();
  const condition = document.getElementById('f-condition').value;
  const desc = document.getElementById('f-desc').value.trim();
  const start = parseFloat(document.getElementById('f-start').value);

  if(!title){ showToast('Give the piece a title'); return; }
  if(!start || start <= 0){ showToast('Set a starting bid above $0'); return; }

  const lot = {
    id: uid(),
    lotNo: String(lots.length + 1).padStart(3,'0'),
    title, size, condition, desc,
    start,
    images: pendingImages.slice(),
    video: pendingVideo || null,
    glyph: GLYPHS[Math.floor(Math.random()*GLYPHS.length)],
    bids: [],
    createdAt: Date.now()
  };
  lots.unshift(lot);
  await saveLots();
  document.getElementById('f-title').value='';
  document.getElementById('f-size').value='';
  document.getElementById('f-desc').value='';
  document.getElementById('f-start').value='';
  pendingImages = [];
  pendingVideo = null;
  document.getElementById('f-video').value = '';
  document.getElementById('videoPending').textContent = '';
  renderPreviews();
  document.getElementById('intake').removeAttribute('open');
  showToast('Lot ' + lot.lotNo + ' posted');
  render();
}

async function placeBid(lotId){
  const nameInput = document.getElementById('name-'+lotId);
  const amtInput = document.getElementById('amt-'+lotId);
  const errEl = document.getElementById('err-'+lotId);
  errEl.textContent = '';

  const lot = lots.find(l => l.id === lotId);
  if(!lot) return;

  const name = nameInput.value.trim();
  const amt = parseFloat(amtInput.value);
  const currentHigh = lot.bids.length ? lot.bids[lot.bids.length-1].amount : lot.start - 0.01;

  if(!name){ errEl.textContent = 'Enter a name to bid'; return; }
  if(!amt || isNaN(amt)){ errEl.textContent = 'Enter a valid amount'; return; }
  if(amt <= currentHigh){ errEl.textContent = 'Must beat $' + fmtMoney(currentHigh); return; }

  lot.bids.push({ name, amount: amt, at: Date.now() });
  await saveLots();
  showToast(name + ' takes the lead on Lot ' + lot.lotNo);
  render();
}

function setActiveImage(lotId, idx, thumbEl){
  const lot = lots.find(l => l.id === lotId);
  if(!lot) return;
  const mainImg = document.getElementById('main-img-'+lotId);
  if(mainImg) mainImg.src = lot.images[idx];
  const badge = mainImg && mainImg.parentElement.querySelector('.photo-count-badge');
  if(badge) badge.textContent = (idx+1) + '/' + lot.images.length;
  const strip = thumbEl.parentElement;
  strip.querySelectorAll('img').forEach(im => im.classList.remove('active'));
  thumbEl.classList.add('active');
}

function lotCard(lot){
  const hasBids = lot.bids.length > 0;
  const current = hasBids ? lot.bids[lot.bids.length-1].amount : lot.start;
  const leader = hasBids ? lot.bids[lot.bids.length-1].name : null;
  const historyRows = lot.bids.slice().reverse().slice(0,8).map(b =>
    `<div class="history-row"><span>${esc(b.name)}</span><b>$${fmtMoney(b.amount)}</b></div>`
  ).join('');

  const hasPhotos = lot.images && lot.images.length > 0;
  const videoHtml = lot.video ? `
    <div class="lot-gallery">
      <video class="main-video" src="${lot.video}" controls playsinline preload="metadata"></video>
      <span class="video-tag">▶ VIDEO</span>
    </div>
  ` : '';

  const galleryHtml = hasPhotos ? `
    <div class="lot-gallery">
      <img class="main-photo" id="main-img-${lot.id}" src="${lot.images[0]}">
      ${lot.images.length > 1 ? `<div class="photo-count-badge">1/${lot.images.length}</div>` : ''}
      ${lot.images.length > 1 ? `
      <div class="thumb-strip">
        ${lot.images.map((src, i) => `<img src="${src}" class="${i===0?'active':''}" onclick="setActiveImage('${lot.id}', ${i}, this)">`).join('')}
      </div>` : ''}
    </div>
  ` : (lot.video ? '' : `
    <div class="lot-swatch">
      <div class="stitch"></div>
      <div class="glyph">${lot.glyph}</div>
    </div>
  `);

  return `
  <div class="lot">
    <div class="lot-badge">LOT ${lot.lotNo}</div>
    ${galleryHtml}
    ${videoHtml}
    <div class="lot-body">
      <div class="lot-title">${esc(lot.title)}</div>
      <div class="lot-meta">
        ${lot.size ? `<span>SIZE ${esc(lot.size)}</span>` : ''}
        <span>${esc(lot.condition)}</span>
      </div>
      ${lot.desc ? `<div class="lot-desc">${esc(lot.desc)}</div>` : ''}

      <div class="bid-block">
        <div class="bid-current-label">${hasBids ? 'Current bid' : 'Starting bid'}${leader ? ' · ' + esc(leader) : ''}</div>
        <div class="bid-current-value"><span class="cur">$</span>${fmtMoney(current)}</div>
        <div class="bid-count">${lot.bids.length} bid${lot.bids.length===1?'':'s'}</div>

        <div class="bid-form">
          <input type="text" class="name-input" id="name-${lot.id}" placeholder="Your name" maxlength="24">
          <input type="number" class="amt-input" id="amt-${lot.id}" placeholder="$${fmtMoney(current + 1)}" min="0" step="1">
          <button onclick="placeBid('${lot.id}')">Bid</button>
        </div>
        <div class="bid-error" id="err-${lot.id}"></div>

        ${hasBids ? `
        <details class="history">
          <summary>Bid history (${lot.bids.length})</summary>
          <div class="history-list">${historyRows}</div>
        </details>` : ''}
      </div>
    </div>
  </div>`;
}

function render(){
  const content = document.getElementById('content');
  document.getElementById('statLots').innerHTML = `<b>${lots.length}</b> lots open`;
  document.getElementById('statBids').innerHTML = `<b>${lots.reduce((s,l)=>s+l.bids.length,0)}</b> bids placed`;

  if(lots.length === 0){
    content.className = '';
    content.innerHTML = `<div class="empty">No lots on the floor yet.<br>Post the first piece above.</div>`;
    return;
  }
  content.className = 'grid';
  content.innerHTML = lots.map(lotCard).join('');
}

document.getElementById('btnAddLot').addEventListener('click', addLot);

/* ---------- PIXEL HORSE ----------
   Drawn as a 4-frame gallop cycle on a 16x12 pixel grid, scaled up 4x.
   Each frame is a list of [x, y, w, h] blocks in grid units. */
(function(){
  const cv = document.getElementById('horseCanvas');
  if(!cv) return;
  const ctx = cv.getContext('2d');
  const PX = 4; // one grid unit = 4 real pixels

  const BODY = '#c08a28';   // brass
  const DARK = '#7d5716';   // shading / legs
  const MANE = '#efe9dc';   // paper — reads against the green backdrop

  // Shared body shape across all frames — only the legs change.
  const bodyParts = [
    // [x, y, w, h, color]
    [3, 4, 8, 4, BODY],    // torso
    [10, 2, 3, 3, BODY],   // neck
    [12, 1, 3, 2, BODY],   // head
    [14, 2, 1, 1, DARK],   // muzzle
    [11, 1, 2, 1, MANE],   // mane
    [10, 3, 1, 1, MANE],   // mane trail
    [2, 3, 1, 3, MANE],    // tail
    [1, 4, 1, 3, MANE],    // tail tip
    [3, 7, 8, 1, DARK],    // belly shading
  ];

  // Four gallop poses: front-leg pair and back-leg pair positions.
  const legFrames = [
    [[4,8,1,3],[6,8,1,3],[9,8,1,3],[10,8,1,2]],
    [[3,8,1,2],[5,8,1,3],[9,8,1,3],[11,8,1,3]],
    [[4,8,1,3],[7,8,1,2],[8,8,1,3],[10,8,1,3]],
    [[5,8,1,3],[6,8,1,2],[9,8,1,2],[11,8,1,3]],
  ];

  let frame = 0;

  function draw(){
    ctx.clearRect(0, 0, cv.width, cv.height);
    for(const [x, y, w, h, color] of bodyParts){
      ctx.fillStyle = color;
      ctx.fillRect(x*PX, y*PX, w*PX, h*PX);
    }
    ctx.fillStyle = DARK;
    for(const [x, y, w, h] of legFrames[frame]){
      ctx.fillRect(x*PX, y*PX, w*PX, h*PX);
    }
    frame = (frame + 1) % legFrames.length;
  }

  draw();
  if(!window.matchMedia('(prefers-reduced-motion: reduce)').matches){
    setInterval(draw, 110);
  }
})();

/* ---------- PIXEL STICKMAN (chasing the horse) ----------
   12x12 grid scaled 4x. Head and torso hold still; arms and legs
   swing through a 4-frame run cycle. */
(function(){
  const cv = document.getElementById('manCanvas');
  if(!cv) return;
  const ctx = cv.getContext('2d');
  const PX = 4;
  const LINE = '#efe9dc';

  // Static core: head, neck, torso.
  const core = [
    [5, 1, 3, 1], [4, 2, 1, 2], [8, 2, 1, 2], [5, 4, 3, 1], // head outline
    [6, 5, 1, 1],                                            // neck
    [6, 6, 1, 4],                                            // torso
  ];

  // Per-frame limbs: arms reaching forward, legs mid-stride.
  const limbFrames = [
    { arms: [[7,6,2,1],[9,5,1,1],[4,7,2,1],[3,8,1,1]],
      legs: [[7,10,2,1],[9,11,1,1],[4,10,2,1],[3,11,1,1]] },
    { arms: [[7,6,1,1],[8,7,1,1],[5,7,1,1],[4,8,1,1]],
      legs: [[6,10,1,2],[7,11,2,1],[5,10,1,2],[4,11,1,1]] },
    { arms: [[4,6,2,1],[3,5,1,1],[7,7,2,1],[9,8,1,1]],
      legs: [[4,10,2,1],[3,11,1,1],[7,10,2,1],[9,11,1,1]] },
    { arms: [[5,6,1,1],[4,7,1,1],[7,7,1,1],[8,8,1,1]],
      legs: [[5,10,1,2],[4,11,1,1],[6,10,1,2],[7,11,2,1]] },
  ];

  let frame = 0;

  function draw(){
    ctx.clearRect(0, 0, cv.width, cv.height);
    ctx.fillStyle = LINE;
    for(const [x, y, w, h] of core){
      ctx.fillRect(x*PX, y*PX, w*PX, h*PX);
    }
    const f = limbFrames[frame];
    for(const [x, y, w, h] of f.arms.concat(f.legs)){
      ctx.fillRect(x*PX, y*PX, w*PX, h*PX);
    }
    frame = (frame + 1) % limbFrames.length;
  }

  draw();
  if(!window.matchMedia('(prefers-reduced-motion: reduce)').matches){
    setInterval(draw, 100); // slightly faster stride than the horse
  }
})();

function startWhenFirebaseReady(){
  if(window.__fb){
    loadLots();
  }else{
    setTimeout(startWhenFirebaseReady, 50);
  }
}
startWhenFirebaseReady();
